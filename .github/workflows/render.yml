# Render 《启动按钮去哪了？》 on GitHub Actions and publish both versions to a Release.
#
#   Actions → "Render film" → Run workflow
#     release_tag: v1.0.0     → renders both versions and publishes them to that Release
#     frames: 585-704         → quick test render of a frame range (kept as workflow artifacts only)
#   …or push a tag v*        → full render + Release named after the tag
#
# GitHub-hosted runners have no GPU, so Chrome renders with SwiftShader (--gl=swangle);
# a full render takes much longer than on a desktop with a GPU.
name: Render film

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish both videos to this Release tag (e.g. v1.0.0). Empty = keep them as workflow artifacts only.'
        type: string
        default: ''
      frames:
        description: 'Quick test: render only this frame range, e.g. 585-704. Empty = the whole film.'
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  render:
    name: Render (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: modicons
            label: mod 图标版
            props: '{"modIcons":true}'
            file: Axolotl-WhereIsTheLaunchButton-modicons-1080p60.mp4
          - variant: lettertiles
            label: 字母方块版
            props: '{"modIcons":false}'
            file: Axolotl-WhereIsTheLaunchButton-lettertiles-1080p60.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          # the finished videos in videos/ are not needed to render
          sparse-checkout: |
            /*
            !/videos/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: System libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-dejavu-core
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install dependencies
        run: npm ci

      - name: Headless Chrome
        run: npx remotion browser ensure

      - name: Render ${{ matrix.label }}
        run: |
          mkdir -p out
          FRAMES=()
          if [ -n "${{ inputs.frames }}" ]; then FRAMES=(--frames="${{ inputs.frames }}"); fi
          npx remotion render WhereIsTheLaunchButton "out/${{ matrix.file }}" \
            --codec=h264 --crf=16 --audio-bitrate=320k --pixel-format=yuv420p \
            --gl=swangle --concurrency=2 --timeout=120000 \
            --props='${{ matrix.props }}' "${FRAMES[@]}"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: out/${{ matrix.file }}
          retention-days: 14
          compression-level: 0

  release:
    name: Publish Release
    needs: render
    if: ${{ inputs.frames == '' && (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.mp4 --clobber
          else
            gh release create "$TAG" dist/*.mp4 --target "$GITHUB_SHA" \
              --title "《启动按钮去哪了？》$TAG" --notes-file .github/release-notes.md
          fi
